name: Anomalie
description: Quelque chose ne fonctionne pas comme documenté.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Faille de sécurité ? Ne pas ouvrir d'issue publique — voir
        [SECURITY.md](../blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version du paquet
      description: '`npm ls @mister-guiiug/dev-pwa-config`'
      placeholder: x.y.z
    validations:
      required: true
  - type: input
    id: subpath
    attributes:
      label: Sous-chemin concerné
      placeholder: react/use-offline-queue, vite-csp, tokens.css…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Attendu / obtenu
      description: Ce que la documentation promet, et ce qui se produit.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Les étapes minimales. Un dépôt minimal vaut mieux qu'une description.
    validations:
      required: true
  # `environnement` N'EST PAS UN NOM LIBRE. `issue-report` du socle préremplit
  # ce formulaire par l'URL, et GitHub ne remplit un champ que si son `id`
  # correspond au paramètre : il envoie `version` et `environnement`. Sans ce
  # champ, l'environnement d'un signalement parti d'un pied de page était perdu
  # en silence. Même identifiant que le gabarit par défaut du compte.
  - type: input
    id: environnement
    attributes:
      label: Environnement
      description: Node, Vite, navigateur, système — ce qui compte pour le sous-chemin concerné.
      placeholder: Node 26, Vite 8, Firefox 156
    validations:
      required: false
  - type: textarea
    id: journal
    attributes:
      label: Journal ou capture
      description: >-
        Console, trace d'erreur, capture d'écran. **Retirer ce qui identifie
        quelqu'un** avant de coller.
      render: text
    validations:
      required: false
  - type: input
    id: app
    attributes:
      label: App concernée
      description: Utile pour savoir combien de dépôts sont touchés.
      placeholder: miss-uwh
