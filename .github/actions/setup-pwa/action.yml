name: 'Setup PWA project'
description: 'Checkout + setup Node 22 (avec scope @mister-guiiug + GitHub Packages) + npm ci'
inputs:
  node-version:
    description: 'Version de Node à installer'
    required: false
    default: '22'
  github-token:
    description: 'Token avec read:packages (généralement secrets.GITHUB_TOKEN)'
    required: true
  install:
    description: 'Exécuter npm ci automatiquement'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Node ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        registry-url: 'https://npm.pkg.github.com'
        scope: '@mister-guiiug'

    - name: Install
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ inputs.github-token }}
