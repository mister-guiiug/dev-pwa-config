name: 'Supabase migrate'
description: 'Setup Supabase CLI + link projet + db push (migrations). Centralise le job custom dupliqué (carbook, molkky).'
inputs:
  access-token:
    description: 'SUPABASE_ACCESS_TOKEN (https://supabase.com/dashboard/account/tokens)'
    required: true
  project-id:
    description: 'Ref du projet Supabase (slug dans l’URL du dashboard)'
    required: true
  db-password:
    description: 'Mot de passe de la base (défini à la création du projet)'
    required: true
  cli-version:
    description: 'Version du CLI Supabase'
    required: false
    # ÉPINGLÉE, et non `latest` : les migrations appliquées par la CI doivent
    # être reproductibles. Avec setup-cli v1, `latest` passait en plus par
    # l'API GitHub SANS jeton, et la limite de débit a fait échouer ce job sur
    # miss-carbook le 30/09/2026 (« Failed to resolve latest Supabase CLI
    # release: rate limit exceeded ») : rien d'appliqué, et le déploiement
    # sauté. Depuis setup-cli v3, le CLI s'installe depuis npm (le paquet
    # `supabase`), sans l'API. Même version dans `pwa-supabase-migrate.yml` et
    # `pwa-supabase-test.yml` (test/supabase-cli-epingle.test.mjs) ; Renovate
    # la propose à jour depuis npm, la source même de l'installation
    # (`customManagers` de renovate.json, d'après la ligne ci-dessous).
    # renovate: datasource=npm depName=supabase
    default: '2.119.0'

runs:
  using: 'composite'
  steps:
    # Action tierce épinglée au SHA (supply-chain) ; Renovate met à jour le pin.
    # v3 : action composite qui installe le CLI par npm (Node 20+ et npm requis,
    # ceux du runner, sinon elle pose Node 24). La v1 tournait sur Node 20,
    # que GitHub déclare obsolète. Même SHA dans `pwa-supabase-test.yml`.
    - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      with:
        version: ${{ inputs.cli-version }}

    - name: Link project
      shell: bash
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access-token }}
        # Passé via env: (pas d'interpolation dans le script) → pas d'injection.
        SUPABASE_PROJECT_ID: ${{ inputs.project-id }}
      run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

    - name: Apply migrations
      shell: bash
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access-token }}
        SUPABASE_DB_PASSWORD: ${{ inputs.db-password }}
      run: supabase db push
