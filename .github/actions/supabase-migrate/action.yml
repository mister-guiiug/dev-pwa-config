name: 'Supabase migrate'
description: 'Setup Supabase CLI + link projet + db push (migrations). Centralise le job custom dupliqué (carbook, molkky).'
inputs:
  access-token:
    description: 'SUPABASE_ACCESS_TOKEN (https://supabase.com/dashboard/account/tokens)'
    required: true
  project-id:
    description: 'Ref du projet Supabase (slug dans l’URL du dashboard)'
    required: true
  db-password:
    description: 'Mot de passe de la base (défini à la création du projet)'
    required: true
  cli-version:
    description: 'Version du CLI Supabase'
    required: false
    # ÉPINGLÉE, et non `latest`. `latest` fait résoudre la version par
    # `setup-cli`, qui interroge l'API GitHub SANS jeton
    # (`resolveLatestVersion`, setup-cli v1.7.1). Le 30/09/2026, sous la charge
    # d'une campagne sur le parc, la limite de débit a fait échouer ce job sur
    # miss-carbook (« Failed to resolve latest Supabase CLI release: rate limit
    # exceeded ») : rien d'appliqué, et le déploiement sauté. Une version fixe
    # se télécharge directement (`releases/download/v<version>/`), sans l'API,
    # et rend en plus les migrations reproductibles. Même version dans
    # `pwa-supabase-migrate.yml` et `pwa-supabase-test.yml`
    # (test/supabase-cli-epingle.test.mjs) ; Renovate la propose à jour
    # (`customManagers` de renovate.json, d'après la ligne ci-dessous).
    # renovate: datasource=github-releases depName=supabase/cli
    default: '2.119.0'

runs:
  using: 'composite'
  steps:
    # Action tierce épinglée au SHA (supply-chain) ; Renovate met à jour le pin.
    - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
      with:
        version: ${{ inputs.cli-version }}

    - name: Link project
      shell: bash
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access-token }}
        # Passé via env: (pas d'interpolation dans le script) → pas d'injection.
        SUPABASE_PROJECT_ID: ${{ inputs.project-id }}
      run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

    - name: Apply migrations
      shell: bash
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access-token }}
        SUPABASE_DB_PASSWORD: ${{ inputs.db-password }}
      run: supabase db push
