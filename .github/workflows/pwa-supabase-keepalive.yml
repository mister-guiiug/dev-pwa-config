# Reusable workflow — anti-pause Supabase Free.
#
# Fait une vraie requête DB (SELECT REST sur une petite table `keep_alive`) avec
# l'anon key → réinitialise le compteur d'inactivité (pause Free à 7 j). À
# appeler via un caller planifié (cron quotidien), un par PROJET Supabase.
#
# Usage côté consumer (.github/workflows/supabase-keepalive.yml) :
#
# name: Supabase keep-alive
# on:
#   schedule: [{ cron: '17 4 * * *' }]
#   workflow_dispatch:
# jobs:
#   keepalive:
#     uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-supabase-keepalive.yml@v6
#     secrets:
#       VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
#       VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
#
# Prérequis : secrets VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY dans le dépôt,
# et la table `keep_alive` appliquée au projet (cf. templates/supabase/keep-alive.sql).
#
# LA SONDE ANONYME (07/11/2026, optionnelle). Le ping ne lit que `keep_alive`,
# une table faite pour répondre. Pendant trois jours, le jeu public de
# miss-arcade a renvoyé 401 à tout visiteur anonyme (une politique RLS
# appelait une fonction que `anon` ne peut pas exécuter) — et ce workflow est
# resté vert chaque matin. `anon-probe` lit en plus, avec la même clé anon, le
# chemin qu'un vrai visiteur emprunte :
#
#     with:
#       anon-probe: 'rest/v1/tenants?select=id&slug=eq.demo&published=eq.true&limit=1'
#       anon-probe-nonempty: true   # la ligne doit exister, pas seulement être lisible
#
# Échec sur 401/403 (la RLS ou un droit refuse `anon`), sur tout autre code
# que 200, et sur une réponse vide si `anon-probe-nonempty`. Sans l'entrée,
# rien ne change.
name: Reusable Supabase keep-alive

on:
  workflow_call:
    inputs:
      table:
        description: 'Table à interroger (anon SELECT). Défaut: keep_alive'
        type: string
        required: false
        default: 'keep_alive'
      anon-probe:
        description: >-
          Chemin lu comme un visiteur anonyme, relatif à l'URL du projet et sous
          `rest/v1/` (ex. `rest/v1/tenants?select=id&slug=eq.demo&limit=1`, ou
          une fonction en GET : `rest/v1/rpc/...`). Vide : pas de sonde.
        type: string
        required: false
        default: ''
      anon-probe-nonempty:
        description: >-
          Exiger une réponse NON VIDE de la sonde anonyme : une RLS qui filtre
          tout rend `[]` en 200, sans erreur.
        type: boolean
        required: false
        default: false
    secrets:
      VITE_SUPABASE_URL:
        description: 'URL du projet Supabase (https://<ref>.supabase.co)'
        required: true
      VITE_SUPABASE_ANON_KEY:
        description: 'anon key (publique, protégée par RLS) — jamais la service_role'
        required: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping (SELECT REST) → réveille la base
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TABLE: ${{ inputs.table }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY manquants."
            exit 1
          fi
          # Le code de sortie de curl est relevé, pas subi : sous `bash -e`, un
          # échec réseau arrêtait l'étape sur un simple « exit code 6 », sans
          # rien dire de la cause.
          rc=0
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "${URL%/}/rest/v1/${TABLE}?select=id&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}") || rc=$?
          # 6 = l'hôte n'existe pas dans le DNS. Relevé sur mister-settle :
          # rouge chaque jour du 18 au 26/10/2026, et le journal ne le disait
          # pas. Un projet gratuit en pause, ou supprimé, n'a plus d'adresse.
          if [ "$rc" = 6 ]; then
            echo "::error::Projet Supabase introuvable : l'adresse de VITE_SUPABASE_URL n'existe plus dans le DNS. Projet en pause : le restaurer depuis le tableau de bord Supabase. Projet supprimé : en créer un, puis mettre à jour VITE_SUPABASE_URL et VITE_SUPABASE_ANON_KEY."
            exit 1
          fi
          if [ "$rc" != 0 ]; then
            echo "::error::Projet Supabase injoignable (curl, code ${rc}). Si l'échec se répète, vérifier l'état du projet dans le tableau de bord Supabase."
            exit 1
          fi
          echo "HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::keep-alive a échoué (HTTP ${code}). Vérifier la table '${TABLE}' et sa policy anon."
            exit 1
          fi
          echo "::notice::Supabase keep-alive OK (SELECT ${TABLE} → 200)."

      # Après le ping : un projet absent ou en pause y est déjà nommé.
      - name: Sonde anonyme (le chemin d'un vrai visiteur)
        if: ${{ inputs.anon-probe != '' }}
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Passées par env:, jamais interpolées dans le script.
          SONDE: ${{ inputs.anon-probe }}
          NON_VIDE: ${{ inputs.anon-probe-nonempty }}
        run: |
          chemin="${SONDE#/}"
          # Sous `rest/v1/` seulement : une lecture PostgREST, ce que fait le
          # client d'un visiteur. Pas d'espace : le chemin part tel quel.
          case "$chemin" in
            *[[:space:]]*)
              echo "::error::anon-probe ne doit pas contenir d'espace : « ${chemin} »."
              exit 1
              ;;
            rest/v1/?*) ;;
            *)
              echo "::error::anon-probe doit commencer par « rest/v1/ » : « ${chemin} »."
              exit 1
              ;;
          esac
          # La ressource sans sa requête, pour les messages.
          ressource="${chemin%%\?*}"
          corps="${RUNNER_TEMP:-/tmp}/sonde-anonyme.json"
          rc=0
          # -g : les crochets et accolades d'un filtre PostgREST ne sont pas
          # des motifs de curl.
          code=$(curl -sS -g -o "$corps" -w '%{http_code}' \
            "${URL%/}/${chemin}" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            -H 'Accept: application/json') || rc=$?
          if [ "$rc" != 0 ]; then
            echo "::error::Sonde anonyme : projet injoignable (curl, code ${rc})."
            exit 1
          fi
          echo "HTTP ${code} (${ressource})"
          # Le message de PostgREST dit la cause (« permission denied for
          # function … ») ; il ne porte ni clé ni donnée.
          detail="$(head -c 300 "$corps" 2>/dev/null | tr -d '\r\n')"
          case "$code" in
            200 | 206) ;;
            401 | 403)
              echo "::error::Sonde anonyme refusée (HTTP ${code}) : un visiteur anonyme ne peut pas lire « ${ressource} ». Vérifier la RLS et les droits du rôle anon — une politique qui appelle une fonction que anon ne peut pas exécuter refuse TOUTE la lecture. Réponse : ${detail}"
              exit 1
              ;;
            *)
              echo "::error::Sonde anonyme : HTTP ${code} sur « ${ressource} ». Réponse : ${detail}"
              exit 1
              ;;
          esac
          if [ "$NON_VIDE" = "true" ]; then
            compact="$(tr -d '[:space:]' < "$corps")"
            case "$compact" in
              '' | '[]' | '{}' | 'null')
                echo "::error::Sonde anonyme : « ${ressource} » répond 200 mais VIDE. La RLS filtre tout pour anon, ou la donnée attendue manque (anon-probe-nonempty)."
                exit 1
                ;;
            esac
          fi
          echo "::notice::Sonde anonyme OK (${ressource} → ${code})."
