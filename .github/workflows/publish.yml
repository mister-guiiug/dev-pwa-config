# Publish dev-wpa-config sur GitHub Packages.
# Note : workflow standalone (ne s'appuie pas sur le reusable npm-publish.yml du
# même repo pour éviter le problème de bootstrap au tag initial v1).
name: Publish to GitHub Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # requis pour faire avancer le tag majeur mobile (v1)
  packages: write
  id-token: write # requis pour npm --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mister-guiiug'

      - name: Vérifier que la version du tag correspond à package.json
        # Ne pas exécuter pour le tag mobile `v1` (toujours v1.x.y avec x ≥ 0).
        if: ${{ github.ref != 'refs/tags/v1' }}
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag $TAG_VERSION ≠ package.json version $PKG_VERSION"
            exit 1
          fi
          echo "✅ Version cohérente : $TAG_VERSION"

      - name: Skip publish on rolling major tag (v1)
        if: ${{ github.ref == 'refs/tags/v1' }}
        run: echo "Tag v1 (rolling major) — pas de publication npm, GitHub Actions consume directly."

      - name: Publish (avec provenance sigstore)
        if: ${{ github.ref != 'refs/tags/v1' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fait pointer le tag majeur mobile (v1) sur cette release stable, afin que
      # tous les consommateurs référençant `...@v1` reçoivent les derniers
      # workflows/actions réutilisables sans intervention manuelle.
      # Ignoré pour les pré-releases (v1.5.0-beta.1) et pour le tag v1 lui-même.
      - name: Advance rolling major tag
        if: ${{ github.ref != 'refs/tags/v1' && !contains(github.ref, '-') }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          MAJOR=${TAG%%.*}            # v1.5.0 -> v1
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
          echo "✅ $MAJOR → $TAG ($GITHUB_SHA)"

      # Crée la GitHub Release correspondante (notes = section du CHANGELOG de
      # cette version). Rend la release visible sur l'onglet Releases + notifie
      # les watchers. Ignoré pour le tag mobile `v1` ; les pré-releases
      # (v3.5.0-beta.1) sont créées et marquées `--prerelease`.
      - name: GitHub Release
        if: ${{ github.ref != 'refs/tags/v1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          # Extrait la section « ## <version> » du CHANGELOG jusqu'au prochain « ## ».
          awk -v v="## $VERSION" '
            $0 == v {f=1; next}
            /^## / {f=0}
            f {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $TAG" > release-notes.md
          fi
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md $PRERELEASE
