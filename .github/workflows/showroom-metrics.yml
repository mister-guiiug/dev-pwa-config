# Relevé nocturne de l'état des dépôts de la famille, pour la vitrine.
#
# La vitrine affiche des étiquettes éditoriales — « stable », « alpha » — que
# rien ne date. Ce workflow ajoute les seules mesures qui ne peuvent pas être
# saisies à la main sans pourrir : dernière release, dernier push, dépôt
# archivé.
#
# Le relevé a lieu en CI et non dans la page : le showroom ne fait aucune
# requête réseau, c'est ce qui lui permet de s'ouvrir en `file://` sans clé
# d'API. Il ne lit donc qu'un fichier statique et daté.
#
# CE WORKFLOW NE COMMITE PLUS RIEN, ET C'EST LA CORRECTION D'UNE PANNE. Il
# poussait `showroom/metrics.js` directement sur `main` ; le ruleset « Protect
# main », posé le 01/09/2026, refuse ce push (« Changes must be made through a
# pull request »). Dernier succès le 01/09, puis douze échecs nocturnes
# consécutifs que personne n'a vus — la vitrine continuait de s'afficher, avec
# des mesures figées au 1er septembre.
#
# Le relevé est donc produit par `showroom-pages.yml`, au moment d'empaqueter
# l'artefact : ce qui est publié est frais par construction, et aucune écriture
# sur une branche protégée n'est nécessaire. Ce workflow-ci ne garde qu'un
# rôle, celui de la cadence — relever pour savoir s'il y a du neuf, et ne
# republier que dans ce cas.
name: Showroom metrics

on:
  schedule:
    # 04:17 UTC : creux de charge côté Actions, et loin des heures rondes que
    # tout le monde choisit.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  # Lecture seule : plus rien n'est écrit dans le dépôt.
  contents: read
  # Redéclencher la publication Pages, seul effet de ce workflow.
  actions: write

concurrency:
  group: showroom-metrics
  cancel-in-progress: false

jobs:
  refresh:
    name: Relever et republier si besoin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '26.9.0'

      # Aucune dépendance à installer : `fetch` et `node:fs` suffisent.
      - name: Relever l'état des dépôts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-metrics.mjs

      # Le fichier doit rester lisible par le test de forme et par la page.
      - name: Vérifier le fichier produit
        run: node --test test/showroom-metrics.test.mjs

      # LA COMPARAISON PORTE SUR CE QUI EST PUBLIÉ, PAS SUR LE DÉPÔT — et c'est
      # la seconde correction. L'ancienne comparait le relevé frais au fichier
      # commité, en croyant ne republier qu'en cas de nouveauté. Or le fichier
      # porte sa propre date de génération, réécrite à chaque exécution : la
      # comparaison était TOUJOURS différente, et la condition n'a jamais pu
      # être fausse une seule nuit. Le fichier du dépôt, désormais figé, aurait
      # rendu ce défaut permanent.
      #
      # La question utile est « la page en ligne dit-elle encore vrai ? ». On
      # la pose donc à la page, en écartant la ligne de date, qui ne dit rien
      # de l'état des dépôts.
      #
      # Page injoignable ou jamais publiée : on republie, c'est le cas où il
      # faut le plus le faire.
      - name: La page en ligne dit-elle encore vrai ?
        id: releve
        env:
          PAGE: https://mister-guiiug.github.io/dev-pwa-config/metrics.js
        run: |
          sans_date() { grep -v '"generatedAt"' "$1"; }
          if ! curl -fsS "$PAGE" -o /tmp/publie.js; then
            echo "Page injoignable ou jamais publiée — publication demandée."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if diff -q <(sans_date /tmp/publie.js) \
                     <(sans_date showroom/metrics.js) > /dev/null; then
            echo "La page en ligne est à jour — rien à republier."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "L'état des dépôts a bougé — publication demandée."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # C'est `showroom-pages.yml` qui refait le relevé et le publie. On le
      # demande explicitement — un `workflow_dispatch` par l'API s'exécute
      # bien, là où un push fait avec le `GITHUB_TOKEN` ne déclencherait aucun
      # autre workflow (protection anti-récursion de GitHub Actions).
      #
      # Seulement quand le relevé a CHANGÉ : republier une page identique
      # chaque nuit ne ferait que du bruit dans l'historique des déploiements.
      - name: Republier le showroom
        if: steps.releve.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run showroom-pages.yml --ref main
