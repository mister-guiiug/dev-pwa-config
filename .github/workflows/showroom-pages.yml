# Publication du showroom du design system sur GitHub Pages.
#
# Site 100 % statique : `showroom/` est publié TEL QUEL, sans build ni
# dépendance. Les ressources y sont référencées en chemins relatifs, le site
# fonctionne donc aussi bien à la racine que sous /dev-pwa-config/.
#
# → https://mister-guiiug.github.io/dev-pwa-config/
name: Deploy showroom

on:
  push:
    branches: [main]
    paths:
      - 'showroom/**'
      - 'components.css'
      - 'tailwind-preset.css'
      - 'apps-catalog.js'
      - 'test/showroom.test.mjs'
      - 'test/components-css.test.mjs'
      - 'test/showroom-i18n.test.mjs'
      - 'test/apps-catalog.test.mjs'
      - '.github/workflows/showroom-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Vérifier la parité puis empaqueter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '26.9.0'

      # Le showroom rejoue `tailwind-preset.css` en CSS natif et embarque des
      # copies de `components.css` et du catalogue famille : on refuse de
      # publier une page qui aurait dérivé de ces sources de vérité. Aucune
      # dépendance à installer (node:test + modules natifs uniquement).
      - name: Parité preset / components / catalogue ↔ showroom
        run: >-
          node --test test/showroom.test.mjs test/components-css.test.mjs
          test/showroom-i18n.test.mjs test/apps-catalog.test.mjs

      # LE RELEVÉ A LIEU ICI, ET N'EST PAS COMMITÉ. Il l'était, par un push
      # direct sur `main` depuis `showroom-metrics.yml` — que le ruleset
      # « Protect main » refuse depuis le 01/09/2026 (« Changes must be made
      # through a pull request »). Le job rougissait chaque nuit sans que la
      # page cesse de s'afficher, et la vitrine a servi douze jours de mesures
      # figées au 1er septembre.
      #
      # Produire le fichier au moment de publier supprime le besoin d'écrire
      # sur une branche protégée : ce qui part dans l'artefact est frais par
      # construction. Le `metrics.js` du dépôt reste la version hors ligne,
      # pour que la page s'ouvre en `file://` — c'est la promesse qui interdit
      # d'appeler l'API depuis le navigateur.
      - name: Relever l'état des dépôts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-metrics.mjs

      # Le fichier part dans l'artefact : il doit rester lisible par la page.
      - name: Vérifier le fichier produit
        run: node --test test/showroom-metrics.test.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: showroom

  deploy:
    name: Déployer
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
