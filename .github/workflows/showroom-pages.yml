# Publication du showroom du design system sur GitHub Pages.
#
# Site 100 % statique : `showroom/` est publié TEL QUEL, sans build ni
# dépendance. Sa CSP (en <meta>) n'autorise les scripts et les feuilles que
# sous l'adresse ci-dessous : servie ailleurs, la page n'a plus de script.
# `npm run showroom` tourne la politique vers son adresse locale.
#
# → https://mister-guiiug.github.io/dev-pwa-config/
name: Deploy showroom

on:
  push:
    branches: [main]
    paths:
      - 'showroom/**'
      - 'components.css'
      - 'tailwind-preset.css'
      - 'apps-catalog.js'
      - 'test/showroom.test.mjs'
      - 'test/components-css.test.mjs'
      - 'test/showroom-i18n.test.mjs'
      - 'test/apps-catalog.test.mjs'
      - 'test/showroom-resolution.test.mjs'
      - 'test/showroom-csp.test.mjs'
      - 'test/showroom-chrome.test.mjs'
      - 'themes.js'
      - 'scripts/showroom-imports.mjs'
      - 'scripts/showroom-csp.mjs'
      - '.github/workflows/showroom-pages.yml'
  workflow_dispatch:

# Aucun droit par défaut : chaque job déclare les siens. `build` exécute du
# code du dépôt et appelle l'API (relevé des dépôts) ; il n'a pas à pouvoir
# publier sur Pages ni à obtenir un jeton OIDC. Seul `deploy` en a besoin.
permissions: {}

# Une seule publication à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Vérifier la parité puis empaqueter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'

      # Le showroom rejoue `tailwind-preset.css` en CSS natif et embarque des
      # copies de `components.css` et du catalogue famille : on refuse de
      # publier une page qui aurait dérivé de ces sources de vérité. Aucune
      # dépendance à installer (node:test + modules natifs uniquement).
      #
      # `showroom-resolution` vérifie que tout ce que la page charge est DANS
      # `showroom/`, le seul dossier téléversé : un import qui en sort marche
      # depuis le dépôt et casse la page publiée. `showroom-csp` vérifie la
      # politique de sécurité et l'empreinte du script en ligne.
      # `showroom-chrome` vérifie que le texte de la page tient 4,5:1 dans
      # chacun des habillages.
      - name: Parité preset / components / catalogue ↔ showroom
        run: >-
          node --test test/showroom.test.mjs test/components-css.test.mjs
          test/showroom-i18n.test.mjs test/apps-catalog.test.mjs
          test/showroom-resolution.test.mjs test/showroom-csp.test.mjs
          test/showroom-chrome.test.mjs

      # LE RELEVÉ A LIEU ICI, ET N'EST PAS COMMITÉ. Il l'était, par un push
      # direct sur `main` depuis `showroom-metrics.yml` — que le ruleset
      # « Protect main » refuse depuis le 01/09/2026 (« Changes must be made
      # through a pull request »). Le job rougissait chaque nuit sans que la
      # page cesse de s'afficher, et la vitrine a servi douze jours de mesures
      # figées au 1er septembre.
      #
      # Produire le fichier au moment de publier supprime le besoin d'écrire
      # sur une branche protégée : ce qui part dans l'artefact est frais par
      # construction. Le `metrics.js` du dépôt reste la version que lit une
      # copie locale (`npm run showroom`). La page ne fait aucune requête
      # réseau : c'est la promesse qui interdit d'appeler l'API depuis le
      # navigateur.
      - name: Relever l'état des dépôts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-metrics.mjs

      # Le fichier part dans l'artefact : il doit rester lisible par la page.
      - name: Vérifier le fichier produit
        run: node --test test/showroom-metrics.test.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: showroom

  deploy:
    name: Déployer
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
