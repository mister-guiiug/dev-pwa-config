# Refuse les signatures d'assistant sur les pull requests.
#
# Appel, une fois ce fichier publié sur l'étiquette mobile :
#
# name: Signatures IA
# on:
#   pull_request:
# permissions:
#   contents: read
# jobs:
#   signatures:
#     uses: mister-guiiug/dev-pwa-config/.github/workflows/no-ai-attribution.yml@v6
#
# Le script n'est pas dans le dépôt appelant. On le prend au commit du workflow
# lui-même (`github.workflow_sha`) : la même étiquette sert le YAML et le
# contrôle, et une application ne dépend pas d'une copie locale.
name: Signatures IA

on:
  workflow_call:

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # L'historique des deux côtés, pour lister les commits de la branche.
          fetch-depth: 0

      - name: Récupérer le contrôle
        uses: actions/checkout@v7
        with:
          repository: mister-guiiug/dev-pwa-config
          ref: ${{ github.workflow_sha }}
          path: .dwc-attribution

      - name: Relire les messages de commit de la branche
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          echo "Commits examinés :"
          git log --format='  %h %s' "$base..$head"

          faute=0
          for sha in $(git rev-list "$base..$head"); do
            git log -1 --format='%B' "$sha" > /tmp/msg.txt
            if ! node .dwc-attribution/scripts/check-ai-attribution.mjs --message /tmp/msg.txt; then
              echo "  ↑ commit $sha"
              faute=1
            fi
          done
          exit $faute

      - name: Relire les fichiers modifiés
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          fichiers=$(git diff --name-only --diff-filter=ACMR "$base..$head")
          [ -z "$fichiers" ] && exit 0
          node .dwc-attribution/scripts/check-ai-attribution.mjs --files $fichiers
