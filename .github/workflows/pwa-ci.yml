# Reusable workflow CI standard pour les PWA miss-* / mister-*.
# Usage côté consumer (.github/workflows/ci.yml) :
#
# name: CI
# on: [pull_request, push]
# jobs:
#   ci:
#     uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-ci.yml@v6
#     with:
#       run-doctor: true   # la checklist du parc, lue sur le dépôt ET sur dist/
#       run-e2e: false
#
# DEUX GARDES QUI NE TOURNAIENT NULLE PART, relevé du 05/09/2026 :
#
#   - `pwa-doctor` existait, et une seule application sur vingt l'appelait —
#     le squelette. Les dix-neuf autres n'étaient jamais diagnostiquées. D'où
#     `run-doctor` : opt-in en 4.x, défaut `true` à la prochaine majeure ;
#   - `e2e-grep` valait `@critical` : la spec `@a11y` du gabarit et du
#     squelette n'était JAMAIS exécutée, et Playwright rend « No tests found »
#     avec un code 0 quand rien ne correspond. Le défaut joue désormais
#     `@critical|@a11y`, et un filtre qui ne trouve aucun test fait échouer le
#     job au lieu de le laisser vert.
#
# UN TROISIÈME ANGLE MORT, mesuré le 06/09/2026 : `e2e-project` servait à la
# fois à `--project=` et à `playwright install`, qui n'accepte que des noms de
# NAVIGATEURS. `playwright install mobile-chrome` répond « Invalid installation
# targets » : les deux projets mobiles de la matrice famille (Pixel 5, iPhone
# 12) étaient donc inexprimables, et l'entrée n'en acceptait qu'un seul.
# Deux tests de miss-badminton échouaient sur ces deux projets DEPUIS TOUJOURS
# — un lien de la barre latérale, cherché sous le seuil `md` où elle n'existe
# pas. L'entrée accepte désormais une LISTE, et les navigateurs à installer
# s'en déduisent : `chromium mobile-chrome` n'installe que `chromium`, Pixel 5
# tournant sur le même binaire. Coût mesuré de ce second projet : sept
# secondes, dans un job qui en coûte soixante dont quarante de mise en place.
# Le défaut reste `chromium` : un socle ne rend pas rouges les CI qu'il sert.
#
# UN QUATRIÈME, mesuré le 13/09/2026 pendant la montée du parc en Vitest 5 :
# ce workflow lance `npm run test`, et rien d'autre. Or Vitest ne calcule
# aucune couverture sans `--coverage`, donc n'en compare aucun seuil : un
# `thresholds` inscrit dans `vitest.config.ts` n'était VÉRIFIÉ que si le script
# `test` du dépôt portait lui-même le drapeau. Six dépôts déclaraient des
# seuils ; UN SEUL les jouait (`mister-footcoach`). Les cinq autres écrivaient
# un script `test:coverage` que personne n'appelait — et TROIS échouaient à
# leur propre plancher depuis toujours, sans qu'aucun job ne rougisse.
# D'où `run-coverage`. Elle est opt-in, comme `run-doctor` : un socle ne rend
# pas rouges les CI qu'il sert. Mais elle refuse de démarrer quand le script
# manque, plutôt que de retomber en silence sur `npm run test` — une garde qui
# se tait reproduirait exactement la panne qu'elle est censée réparer.
#
# UN CINQUIÈME, mesuré le 14/09/2026, au lendemain de l'activation des alertes
# Dependabot sur les vingt-huit dépôts : l'étape d'audit ne s'exécutait QU'À LA
# RACINE. Le lot facile vidé, les vingt-cinq alertes restantes du parc étaient
# TOUTES dans un second manifeste, aucune à la racine — `mister-puzzle/server`
# (neuf, toutes en portée `runtime` : socket.io, engine.io, ws, qs,
# body-parser), `miss-genius/worker` (quinze) et `miss-supatool/proxy` (une).
# `npm audit --omit=dev` à la racine rendait « 0 vulnérabilité » dans les trois
# cas, et c'était EXACT. Or `mister-puzzle` déclare `server-dir: server` : le
# réutilisable savait où était le backend, il l'y type-vérifiait, il ne l'y
# auditait pas. L'audit suit désormais `server-dir`.
name: Reusable PWA CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '26.2.0'
      run-format-check:
        type: boolean
        required: false
        default: true
      run-lint:
        type: boolean
        required: false
        default: true
      run-type-check:
        type: boolean
        required: false
        default: true
      run-tests:
        type: boolean
        required: false
        default: true
      run-coverage:
        description: >-
          Joue `npm run test:coverage` à la place de `npm run test`, pour que
          les seuils déclarés dans `vitest.config.ts` soient VÉRIFIÉS. Sans
          cette entrée un plancher de couverture n'est qu'un commentaire :
          Vitest ne mesure rien sans `--coverage`, donc ne compare rien, et le
          job sort vert. Exige un script `test:coverage` dans le `package.json`
          du dépôt — son absence fait échouer le job avec un message clair,
          jamais un repli silencieux sur `npm run test`.
        type: boolean
        required: false
        default: false
      run-build:
        type: boolean
        required: false
        default: true
      run-doctor:
        description: >-
          Lance `pwa-doctor` après le build : la checklist du parc, lue sur le
          dépôt et sur `dist/`. Échoue sur un DÉFAUT (quelqu'un en souffre) ;
          avec `doctor-strict`, aussi sur une dette. Opt-in en 4.x, défaut
          `true` à la prochaine majeure.
        type: boolean
        required: false
        default: false
      doctor-strict:
        description: >-
          `pwa-doctor --strict` : une dette suffit à échouer. C'est le régime
          du squelette ; une application l'adopte quand son diagnostic est
          revenu à zéro.
        type: boolean
        required: false
        default: false
      verify-lockfile:
        description: >-
          Vérifie en PR que package-lock.json est synchronisé avec package.json.
          Détecte tôt (message clair) le lockfile désynchronisé qui casse
          `npm ci` — typiquement les bindings natifs optionnels de Vite 8 /
          Rolldown / oxc omis du lock quand il est généré hors Linux.
        type: boolean
        required: false
        default: true
      run-npm-audit:
        description: >-
          Lance `npm audit` (SCA) sur les dépendances de PRODUCTION — à la
          racine, ET dans `server-dir` quand cette entrée est renseignée : les
          vingt-cinq alertes restantes du parc au 14/09/2026 vivaient toutes
          dans un second manifeste, jamais à la racine. Actif par défaut depuis
          le 13/09/2026. Il a longtemps été opt-in « le temps de résorber les
          vulnérabilités existantes » : ce temps est écoulé — les 27 copies du
          parc ont été auditées ce jour-là, 24 sont sans `high`/`critical` en
          production. Une app qui doit rester rouge le temps d'un correctif
          écrit `run-npm-audit: false` avec la raison.
        type: boolean
        required: false
        default: true
      npm-audit-level:
        description: "Seuil d'échec de npm audit (low|moderate|high|critical)."
        type: string
        required: false
        default: 'high'
      run-e2e:
        type: boolean
        required: false
        default: false
      e2e-grep:
        description: >-
          Filtre `--grep` de Playwright. Défaut `@critical|@a11y` : le parcours
          critique ET la suite axe-core du gabarit. Un filtre qui ne trouve
          aucun test fait échouer le job.
        type: string
        required: false
        default: '@critical|@a11y'
      e2e-project:
        description: >-
          Projet(s) Playwright à jouer, séparés par des espaces — par exemple
          `chromium mobile-chrome` pour couvrir le bureau ET le téléphone.
          Chaque nom devient un `--project=`, et les navigateurs à installer
          s'en déduisent (`mobile-chrome` → chromium, `mobile-safari` →
          webkit), sans doublon. Un nom hors de `[A-Za-z0-9._-]` fait échouer
          le job.
        type: string
        required: false
        default: 'chromium'
      e2e-install:
        description: >-
          Navigateurs à installer, quand la déduction ne suffit pas — un projet
          maison (`extraProjects`) porte un nom que `playwright install` ne
          connaît pas. Renseignée, cette liste REMPLACE la déduction. Vide par
          défaut.
        type: string
        required: false
        default: ''
      build-env:
        description: >-
          Variables d'environnement injectées avant le build/test, une par ligne
          au format KEY=VALUE (ex. des VITE_* factices pour les apps Firebase /
          Supabase dont le build exige des clés). Vide par défaut.
        type: string
        required: false
        default: ''
      server-dir:
        description: >-
          Dossier d'un backend annexe (ex. "server") à installer, type-checker
          (npm ci + tsc --noEmit) et AUDITER — son `package.json` est un second
          manifeste, que l'audit de la racine ne voit pas. Vide = pas de job
          serveur. Le dossier doit porter son lockfile : sans lui `npm audit`
          n'a rien à lire, et l'étape échoue en le disant plutôt que de sauter
          en silence — `npm ci` l'exigeait déjà de toute façon.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  # Détecte un package-lock.json désynchronisé AVANT le `npm ci` cryptique du job
  # quality. Job indépendant : un message clair sort même si `npm ci` échoue.
  verify-lockfile:
    name: Lockfile in sync
    if: ${{ inputs.verify-lockfile }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: mister-guiiug/dev-pwa-config/.github/actions/setup-pwa@v6
        with:
          node-version: ${{ inputs.node-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install: 'false'

      - name: Check package-lock.json is in sync with package.json
        if: ${{ hashFiles('package-lock.json') != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            echo "::error::package-lock.json désynchronisé de package.json — lance 'npm install' et committe le lockfile à jour."
            echo "Cause fréquente : bindings natifs optionnels (Vite 8 / Rolldown / oxc : @emnapi/*, @rolldown/binding-*) omis du lock quand il est généré hors Linux." >&2
            git --no-pager diff --stat -- package-lock.json >&2 || true
            exit 1
          fi
          echo "✅ package-lock.json synchronisé avec package.json."

  quality:
    name: Format · Lint · Type · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: mister-guiiug/dev-pwa-config/.github/actions/setup-pwa@v6
        with:
          node-version: ${{ inputs.node-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject build env
        if: ${{ inputs.build-env != '' }}
        env:
          # Passé via env: (jamais interpolé dans le corps du script) pour éviter
          # toute injection shell. Chaque ligne doit être au format KEY=VALUE.
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              [A-Za-z_]*=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
              *) echo "❌ build-env: ligne invalide (attendu KEY=VALUE): $line" >&2; exit 1 ;;
            esac
          done <<< "$BUILD_ENV"

      - name: Format check
        if: ${{ inputs.run-format-check }}
        run: npm run format:check

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: npm run lint

      - name: Type check
        if: ${{ inputs.run-type-check }}
        run: npm run type-check

      # Le contrat de `run-coverage` se vérifie AVANT de lancer la suite : un
      # dépôt qui la demande sans script `test:coverage` — ou qui a coupé ses
      # tests — croirait ses seuils gardés pendant que rien ne les lit. C'est
      # la panne que cette entrée répare ; la rejouer ici serait absurde.
      - name: run-coverage est tenable
        if: ${{ inputs.run-coverage }}
        env:
          RUN_TESTS: ${{ inputs.run-tests }}
        run: |
          if [ "$RUN_TESTS" != "true" ]; then
            echo "::error::run-coverage demandé avec run-tests: false — aucun test ne tourne, donc aucun seuil n'est vérifié. Choisir l'un ou l'autre."
            exit 1
          fi
          # `npm pkg get` rend `{}` pour une clé absente, et sort 0 dans les
          # deux cas : c'est la VALEUR qu'il faut lire, pas le code de retour.
          if [ "$(npm pkg get scripts.test:coverage)" = '{}' ]; then
            echo "::error::run-coverage demandé, mais package.json n'a pas de script « test:coverage ». L'ajouter : vitest run --coverage."
            exit 1
          fi
          echo "✅ npm run test:coverage — les seuils de vitest.config.ts seront vérifiés."

      - name: Test
        if: ${{ inputs.run-tests && !inputs.run-coverage }}
        run: npm run test

      # Deux étapes plutôt qu'un `if` dans le script : le journal de la CI dit
      # alors lequel des deux régimes a tourné, sans qu'il faille le déduire.
      - name: Test (couverture et seuils)
        if: ${{ inputs.run-tests && inputs.run-coverage }}
        run: npm run test:coverage

      - name: Build
        if: ${{ inputs.run-build }}
        run: npm run build

      # APRÈS le build : le docteur lit `dist/` (manifeste, icônes, langue,
      # CSP, 404.html) en plus du dépôt. Sans build, ces lectures sont sautées
      # et il le dit.
      - name: Doctor (conformité au parc)
        if: ${{ inputs.run-doctor }}
        env:
          STRICT: ${{ inputs.doctor-strict }}
          # Le seul contrôle qui ne se lit pas sur le disque : les issues du
          # dépôt sont-elles ouvertes ? Le lien « Signaler un problème » du
          # pied de page mène à `issues/new`, qui répond 404 quand elles sont
          # désactivées. `github.token` — et non un secret déclaré : le jeton
          # automatique du run suffit (`metadata: read` est toujours accordé)
          # et ne demande rien à l'appelant. Sans lui, le contrôle se tait.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$STRICT" = "true" ]; then
            npx pwa-doctor --strict
          else
            npx pwa-doctor
          fi

      # Le seuil part par `env:` : c'est du texte d'appelant, il n'a rien à
      # faire dans une ligne de commande — la règle est la même que pour
      # `build-env` et les entrées `e2e-*`.
      - name: Audit dependencies (SCA)
        if: ${{ inputs.run-npm-audit }}
        env:
          AUDIT_LEVEL: ${{ inputs.npm-audit-level }}
        run: npm audit --omit=dev --audit-level="$AUDIT_LEVEL"

      # Le second manifeste. Deux étapes plutôt qu'une boucle : le journal dit
      # alors lequel des deux a parlé, comme le couple `Test` / `Test
      # (couverture et seuils)`.
      #
      # Avant `npm ci`, à dessein : `npm audit` lit le LOCKFILE et n'a besoin
      # d'aucune installation (mesuré). Sans lockfile il répondrait `ENOLOCK`
      # — un rouge sans explication au milieu d'un job ; la garde le dit en
      # clair. Elle ne fabrique surtout pas un lockfile à la volée : auditer
      # des versions résolues du jour rendrait un vert qui ne parle pas de ce
      # que le dépôt livre. Et ce n'est pas un rouge neuf — l'étape suivante
      # fait `npm ci`, qui refuse déjà ce cas, plus bas et moins clairement.
      #
      # Le `./` du motif n'est pas décoratif : `server-dir` vide donnerait
      # `/package.json`, un chemin ABSOLU, que `hashFiles` refuse hors du
      # workspace — une erreur d'évaluation, pas une condition fausse. Le test
      # `inputs.server-dir != ''` passe d'abord et court-circuite, mais une
      # condition ne doit pas dépendre de l'ordre d'évaluation pour être sûre.
      - name: Audit dependencies (SCA — ${{ inputs.server-dir }})
        if: ${{ inputs.run-npm-audit && inputs.server-dir != '' && hashFiles(format('./{0}/package.json', inputs.server-dir)) != '' }}
        working-directory: ${{ inputs.server-dir }}
        env:
          AUDIT_LEVEL: ${{ inputs.npm-audit-level }}
          SERVER_DIR: ${{ inputs.server-dir }}
        run: |
          if [ ! -f package-lock.json ] && [ ! -f npm-shrinkwrap.json ]; then
            echo "::error::$SERVER_DIR n'a pas de lockfile : npm audit ne peut rien lire (ENOLOCK), et l'étape « Server — install & type-check » échouerait de même sur npm ci. Committer le package-lock.json de ce dossier."
            exit 1
          fi
          npm audit --omit=dev --audit-level="$AUDIT_LEVEL"

      - name: Server — install & type-check
        if: ${{ inputs.server-dir != '' }}
        working-directory: ${{ inputs.server-dir }}
        run: |
          npm ci
          npx tsc --noEmit

  e2e:
    name: E2E (${{ inputs.e2e-grep }})
    if: ${{ inputs.run-e2e }}
    needs: quality
    runs-on: ubuntu-latest
    env:
      # Passés par l'environnement, jamais interpolés dans un script : un filtre
      # est une expression, pas une ligne de commande.
      E2E_GREP: ${{ inputs.e2e-grep }}
      E2E_PROJECT: ${{ inputs.e2e-project }}
      E2E_INSTALL: ${{ inputs.e2e-install }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: mister-guiiug/dev-pwa-config/.github/actions/setup-pwa@v6
        with:
          node-version: ${{ inputs.node-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Une seule lecture de `e2e-project`, trois usages : les `--project=` des
      # deux étapes Playwright, les navigateurs à installer, et le nom de
      # l'artefact. Les listes repartent par l'environnement — jamais par une
      # interpolation dans un corps de script.
      - name: Projets Playwright et navigateurs à installer
        id: matrice
        run: |
          set -f # la liste se découpe sur les espaces, et rien de plus : aucun motif ne s'expanse

          valider() {
            case "$1" in
              '' | *[!A-Za-z0-9._-]*)
                echo "::error::$2 : « $1 » n'est pas un nom valide (attendu [A-Za-z0-9._-])."
                exit 1
                ;;
            esac
          }

          args=''
          cibles=''
          slug=''
          for projet in $E2E_PROJECT; do
            valider "$projet" e2e-project
            args="$args --project=$projet"
            slug="$slug-$projet"
            # `playwright install` ne connaît que des navigateurs : un projet
            # mobile s'installe par le moteur sur lequel il tourne.
            case "$projet" in
              mobile-chrome) cible=chromium ;;
              mobile-safari) cible=webkit ;;
              *) cible=$projet ;;
            esac
            # Sans dédoublonnage, `chromium mobile-chrome` téléchargerait deux
            # fois le même binaire.
            case " $cibles " in
              *" $cible "*) ;;
              *) cibles="$cibles $cible" ;;
            esac
          done

          if [ -z "$args" ]; then
            echo "::error::e2e-project est vide — au moins un projet Playwright est requis."
            exit 1
          fi

          if [ -n "$E2E_INSTALL" ]; then
            cibles=''
            for cible in $E2E_INSTALL; do
              valider "$cible" e2e-install
              cibles="$cibles $cible"
            done
          fi

          {
            echo "E2E_PROJECT_ARGS=${args# }"
            echo "E2E_INSTALL_TARGETS=${cibles# }"
          } >> "$GITHUB_ENV"
          echo "slug=${slug#-}" >> "$GITHUB_OUTPUT"
          echo "Projets : ${args# } · navigateurs : ${cibles# }"

      # Sans guillemets, à dessein : la liste doit se découper en arguments.
      # C'est l'étape précédente qui la rend sûre — chaque nom y est filtré sur
      # `[A-Za-z0-9._-]`, donc aucun motif ne peut s'expanser ici.
      - name: Install Playwright browsers
        run: npx playwright install $E2E_INSTALL_TARGETS --with-deps

      # `playwright test --grep` qui ne trouve rien imprime « No tests found »
      # et rend 0 : un `run-e2e: true` sans spec taguée était un job vert qui
      # ne jouait rien. Le squelette et le gabarit ont porté une spec `@a11y`
      # jamais exécutée pour cette raison.
      - name: Le filtre trouve des tests
        run: |
          listing=$(npx playwright test --list --grep "$E2E_GREP" $E2E_PROJECT_ARGS 2>&1 || true)
          total=$(printf '%s\n' "$listing" | sed -n 's/^Total: \([0-9][0-9]*\) tests\{0,1\} in .*/\1/p' | tail -1)
          if [ -z "$total" ] || [ "$total" = "0" ]; then
            printf '%s\n' "$listing" | tail -20
            echo "::error::run-e2e est demandé, mais aucun test ne correspond à « $E2E_GREP » — Playwright rendrait « No tests found » sans échouer. Taguer les specs (@critical, @a11y) ou ajuster e2e-grep."
            exit 1
          fi
          echo "$total test(s) pour « $E2E_GREP »."

      - name: Run E2E
        run: npx playwright test --grep "$E2E_GREP" $E2E_PROJECT_ARGS
        env:
          CI: true

      # Le nom d'un artefact refuse `|`, `:` et `/` : le filtre n'y a pas sa
      # place — `@critical|@a11y` ferait échouer l'envoi du rapport, au moment
      # précis où on en a besoin. Une LISTE de projets n'y a pas sa place non
      # plus telle quelle : `chromium mobile-chrome` devient
      # `chromium-mobile-chrome`, calculé à l'étape `matrice`.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ steps.matrice.outputs.slug }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
