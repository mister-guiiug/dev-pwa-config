# Reusable workflow CI standard pour les PWA miss-* / mister-*.
# Usage côté consumer (.github/workflows/ci.yml) :
#
# name: CI
# on: [pull_request, push]
# jobs:
#   ci:
#     uses: mister-guiiug/dev-wpa-config/.github/workflows/pwa-ci.yml@v1
#     secrets: inherit
#     with:
#       run-e2e: false
name: Reusable PWA CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '22'
      run-format-check:
        type: boolean
        required: false
        default: true
      run-lint:
        type: boolean
        required: false
        default: true
      run-type-check:
        type: boolean
        required: false
        default: true
      run-tests:
        type: boolean
        required: false
        default: true
      run-build:
        type: boolean
        required: false
        default: true
      run-npm-audit:
        description: >-
          Lance `npm audit` (SCA) sur les dépendances de production. Opt-in :
          désactivé par défaut le temps de résorber les vulnérabilités existantes.
        type: boolean
        required: false
        default: false
      npm-audit-level:
        description: "Seuil d'échec de npm audit (low|moderate|high|critical)."
        type: string
        required: false
        default: 'high'
      run-e2e:
        type: boolean
        required: false
        default: false
      e2e-grep:
        type: string
        required: false
        default: '@critical'
      e2e-project:
        type: string
        required: false
        default: 'chromium'
      build-env:
        description: >-
          Variables d'environnement injectées avant le build/test, une par ligne
          au format KEY=VALUE (ex. des VITE_* factices pour les apps Firebase /
          Supabase dont le build exige des clés). Vide par défaut.
        type: string
        required: false
        default: ''
      server-dir:
        description: >-
          Dossier d'un backend annexe (ex. "server") à installer et type-checker
          (npm ci + tsc --noEmit). Vide = pas de job serveur.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  quality:
    name: Format · Lint · Type · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mister-guiiug/dev-wpa-config/.github/actions/setup-pwa@v1
        with:
          node-version: ${{ inputs.node-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject build env
        if: ${{ inputs.build-env != '' }}
        run: printf '%s\n' "${{ inputs.build-env }}" >> "$GITHUB_ENV"

      - name: Format check
        if: ${{ inputs.run-format-check }}
        run: npm run format:check

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: npm run lint

      - name: Type check
        if: ${{ inputs.run-type-check }}
        run: npm run type-check

      - name: Test
        if: ${{ inputs.run-tests }}
        run: npm run test

      - name: Build
        if: ${{ inputs.run-build }}
        run: npm run build

      - name: Audit dependencies (SCA)
        if: ${{ inputs.run-npm-audit }}
        run: npm audit --omit=dev --audit-level=${{ inputs.npm-audit-level }}

      - name: Server — install & type-check
        if: ${{ inputs.server-dir != '' }}
        working-directory: ${{ inputs.server-dir }}
        run: |
          npm ci
          npx tsc --noEmit

  e2e:
    name: E2E (${{ inputs.e2e-grep }})
    if: ${{ inputs.run-e2e }}
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mister-guiiug/dev-wpa-config/.github/actions/setup-pwa@v1
        with:
          node-version: ${{ inputs.node-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install ${{ inputs.e2e-project }} --with-deps

      - name: Run E2E
        run: npx playwright test --grep "${{ inputs.e2e-grep }}" --project=${{ inputs.e2e-project }}
        env:
          CI: true

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ inputs.e2e-grep }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
