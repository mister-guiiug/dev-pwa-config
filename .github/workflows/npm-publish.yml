# Reusable workflow de publication npm (GitHub Packages) avec provenance.
#
# ⚠️ Périmètre : réservé aux dépôts qui PUBLIENT un paquet npm. Les apps PWA
# (miss-* / mister-*) ne publient rien → elles n'utilisent PAS ce workflow.
# `dev-wpa-config` se publie lui-même via `publish.yml` (standalone, bootstrap-safe
# au tag initial, + avancement du tag majeur mobile). Conservé pour un éventuel
# futur paquet de la famille.
#
# Usage côté consumer (.github/workflows/publish.yml) :
#
# name: Publish
# on:
#   push:
#     tags: ['v*']
# jobs:
#   publish:
#     uses: mister-guiiug/dev-wpa-config/.github/workflows/npm-publish.yml@v3
#     secrets: inherit
name: Reusable npm publish

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '22'
      verify-tag:
        description: 'Vérifier que le tag git correspond à package.json#version'
        type: boolean
        required: false
        default: true
      provenance:
        description: 'Publier avec --provenance (signature sigstore)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write
  id-token: write # requis pour --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: mister-guiiug/dev-wpa-config/.github/actions/setup-pwa@v3
        with:
          node-version: ${{ inputs.node-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérifier la cohérence tag / package.json
        if: ${{ inputs.verify-tag }}
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag $TAG_VERSION ≠ package.json $PKG_VERSION"
            exit 1
          fi
          echo "✅ Version cohérente : $TAG_VERSION"

      - name: Publish
        # --access public requis avec --provenance pour les nouveaux paquets / paquets restreints.
        run: npm publish ${{ inputs.provenance && '--provenance --access public' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
