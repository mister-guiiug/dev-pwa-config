name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: In-repo config parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          # Le lockfile est désormais commité : installs reproductibles, et le
          # cache npm redevient possible. Deux exécutions à une semaine d'écart
          # installaient auparavant des arbres différents.
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # format + lint + typecheck + tests. Le paquet publiait deux configs
      # ESLint sans en appliquer aucune, et livrait `tsconfig-strict-plus` sans
      # jamais type-checker ses propres déclarations.
      - name: Validate
        run: npm run validate

      - name: Les fichiers engendrés sont à jour
        run: |
          npm run sync
          if ! git diff --quiet; then
            echo "::error::Un dérivé a divergé de sa source. Lancer 'npm run sync' et recommiter."
            git --no-pager diff --stat
            exit 1
          fi
          echo "✅ showroom, JSON-LD et tableau du README alignés sur leurs sources"

      - name: Verify TS configs parse
        run: |
          node -e "JSON.parse(require('fs').readFileSync('./tsconfig-app.json'))"
          node -e "JSON.parse(require('fs').readFileSync('./tsconfig-app-react.json'))"
          node -e "JSON.parse(require('fs').readFileSync('./tsconfig-node.json'))"
          node -e "JSON.parse(require('fs').readFileSync('./tsconfig-strict-plus.json'))"
          echo "✅ tsconfigs parsent"

  # ── Le squelette, construit sur CE paquet ───────────────────────────────────
  #
  # Ce job remplace la fixture jetable qui vivait ici. Elle échafaudait un faux
  # consommateur dans `/tmp` pour vérifier que les sous-chemins de la table
  # `exports` se résolvent — le trou qui avait laissé passer le bug de
  # résolution de `./tsconfig-app-react`, lequel avait forcé mister-molkky à
  # ré-inliner ses configs.
  #
  # `pwa-starter-kit` est un VRAI consommateur, tenu vert, qui importe la
  # composition entière : fournisseurs, routeur, écrans, backend, i18n, mise à
  # jour du service worker. Il prouve donc ce que la fixture ne pouvait pas —
  # qu'une application se COMPILE, se CONSTRUIT et reste conforme au parc avec
  # la version candidate — et il le prouve avant que vingt applications ne
  # découvrent le contraire.
  #
  # LE BALAYAGE EXHAUSTIF EST CONSERVÉ, et c'est délibéré. Le squelette
  # n'importe que 51 sous-chemins sur 148 : s'en remettre à lui seul perdrait
  # la résolution des 90 autres, dont personne ne verrait la rupture avant
  # qu'une application ne les touche. Il est simplement rejoué DEPUIS le
  # squelette, dont le `node_modules` porte déjà toutes les peers — c'est ce
  # qui rend la fixture inutile, pas ce qui rend le balayage inutile.
  starter-kit:
    name: Le squelette, construit sur ce paquet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Empaqueter la version candidate
        run: |
          npm ci --no-audit --no-fund
          npm pack
          echo "TARBALL=$(ls "$GITHUB_WORKSPACE"/mister-guiiug-dev-pwa-config-*.tgz | head -1)" >> "$GITHUB_ENV"

      # Dépôt PUBLIC : le jeton par défaut suffit à le lire. Épinglé sur `main`,
      # qui est protégé et ne reçoit que des PR vertes.
      - uses: actions/checkout@v5
        with:
          repository: mister-guiiug/pwa-starter-kit
          path: starter-kit
          persist-credentials: false

      - name: Installer le squelette SUR le paquet empaqueté
        working-directory: starter-kit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # La dépendance est REMPLACÉE par le tarball : sans cela, le squelette
          # installerait la dernière version PUBLIÉE et ce job ne testerait pas
          # la modification en cours.
          npm pkg set "devDependencies.@mister-guiiug/dev-pwa-config=file:$TARBALL"

          # NPM 11 POUR CETTE INSTALLATION. Node 22 embarque npm 10.9.8, dont
          # Arborist échoue sur « Cannot read properties of null (reading
          # 'edgesOut') » face à une dépendance `file:`. Le job éprouve le
          # paquet, pas le gestionnaire : on prend celui qui sait lire l'arbre.
          # `npm install` et non `ci` : le lockfile ne correspond plus, c'est le
          # but.
          npx --yes npm@11 install --no-audit --no-fund

      # Ce que la fixture vérifiait, rejoué là où les peers sont déjà installées.
      - name: Chaque sous-chemin JS s'importe
        working-directory: starter-kit
        run: |
          node --input-type=module -e "
            const { readFileSync } = await import('node:fs');
            const pkg = JSON.parse(
              readFileSync('node_modules/@mister-guiiug/dev-pwa-config/package.json', 'utf8')
            );
            // Un seul module ne s'importe pas hors de son contexte, et c'est
            // voulu : il est nommé, avec sa raison. Une liste d'exclusion muette
            // finirait par cacher un vrai module cassé.
            const CONTEXT_BOUND = {
              'vitest-setup': 'appelle vi.mock() au niveau module — n existe que dans un run Vitest',
            };
            const subs = Object.entries(pkg.exports)
              .filter(([, t]) => (typeof t === 'string' ? t : t.default).endsWith('.js'))
              .map(([s]) => s.replace(/^\.\//, ''));
            let ok = 0;
            for (const s of subs) {
              if (s in CONTEXT_BOUND) continue;
              await import('@mister-guiiug/dev-pwa-config/' + s);
              ok++;
            }
            if (ok < 100) throw new Error('trop peu de sous-chemins couverts : ' + ok);
            console.log(ok + ' sous-chemins JS résolus sur ' + subs.length);
          "

      # La sonde est écrite DANS le squelette, pas dans /tmp : `include` se
      # résout relativement au fichier tsconfig, et `["src"]` ne désignerait
      # rien ailleurs — `tsc` sortirait en TS18003 (« No inputs were found »),
      # ce qui masquerait le vrai test, la résolution du `extends`.
      - name: Les tsconfig s'étendent à travers la table exports
        working-directory: starter-kit
        run: |
          for cfg in tsconfig-app tsconfig-app-react tsconfig-node tsconfig-strict-plus; do
            echo "{\"extends\":\"@mister-guiiug/dev-pwa-config/$cfg\",\"include\":[\"src\"]}" > tsconfig.probe.json
            npx tsc -p tsconfig.probe.json --showConfig >/dev/null && echo "✅ extends $cfg"
          done
          rm -f tsconfig.probe.json

      - name: Les feuilles et les JSON sont bien livrés
        working-directory: starter-kit
        run: |
          for asset in tailwind-preset.css tokens.css components.css tsconfig-app; do
            node -e "require.resolve('@mister-guiiug/dev-pwa-config/$asset')" \
              && echo "✅ $asset présent"
          done

      # LA PREUVE QUE LA FIXTURE NE POUVAIT PAS DONNER. Le squelette se
      # compile, se teste, se construit — et son `build` enchaîne le budget de
      # poids puis `pwa-doctor --strict`, qui refuse la moindre dette. Une
      # modification du socle qui casserait une application le dit ici.
      - name: Lint · types · tests
        working-directory: starter-kit
        run: |
          npm run lint
          npm run type-check
          npm test

      - name: Build, budget de poids et diagnostic strict
        working-directory: starter-kit
        run: npm run build
