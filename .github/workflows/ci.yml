name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: In-repo config parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pas de cache npm : pas de lockfile commité (config-only package).
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Format check (dogfood prettier-base)
        run: npm run format:check

      - name: Unit tests (exports/files/parité/chargement)
        run: npm test

      - name: Verify ESLint configs are syntactically valid
        run: |
          node --input-type=module -e "import('./eslint-base.js').then(m => console.log('eslint-base OK:', m.default.length, 'configs'))"
          node --input-type=module -e "import('./eslint-react.js').then(m => console.log('eslint-react OK:', m.default.length, 'configs'))"

      - name: Verify Prettier config is valid
        run: |
          node --input-type=module -e "import('./prettier-base.js').then(m => console.log('prettier OK:', JSON.stringify(m.default)))"

      - name: Verify TS configs parse
        run: |
          node -e "JSON.parse(require('fs').readFileSync('./tsconfig-app.json'))"
          node -e "JSON.parse(require('fs').readFileSync('./tsconfig-app-react.json'))"
          node -e "JSON.parse(require('fs').readFileSync('./tsconfig-node.json'))"
          echo "✅ tsconfigs parsent"

      - name: Verify vitest configs parse
        run: |
          node --input-type=module -e "import('./vitest-base.js').then(m => console.log('vitest-base OK:', JSON.stringify(m.baseTestOptions)))"
          node --input-type=module -e "import('./vitest-browser-base.js').then(m => console.log('vitest-browser-base OK:', JSON.stringify(m.baseBrowserTestOptions)))"

      - name: Verify other configs parse
        run: |
          node --input-type=module -e "import('./commitlint-base.js').then(m => console.log('commitlint OK'))"
          node --input-type=module -e "import('./lint-staged-base.js').then(m => console.log('lint-staged OK'))"
          node --input-type=module -e "import('./playwright-base.js').then(m => console.log('playwright-base OK'))"
          node --input-type=module -e "import('./tailwind-preset.js').then(m => console.log('tailwind-preset OK'))"
          node --input-type=module -e "import('./vite-pwa-base.js').then(m => console.log('vite-pwa-base OK'))"

  # ── Smoke test « consommateur réel » ────────────────────────────────────────
  # Le job `validate` ci-dessus ne teste que le parsing des fichiers DANS le repo.
  # Il ne prouve PAS que le paquet, une fois `npm pack` + installé, résout ses
  # subpath via la table `exports`. C'est exactement ce trou qui a laissé passer
  # le bug de résolution intermittente du subpath `./tsconfig-app-react` en CI
  # (mister-molkky a dû ré-inliner ses tsconfig/vitest pour le contourner).
  # Ce job reproduit le mode de défaillance réel : extends/import depuis le
  # tarball INSTALLÉ, pas depuis le repo.
  consumer-resolution:
    name: Consumer subpath resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install + pack
        run: |
          npm install --no-audit --no-fund
          npm pack                       # produit mister-guiiug-dev-wpa-config-*.tgz

      - name: Scaffold a throwaway consumer
        run: |
          mkdir -p /tmp/fixture
          cd /tmp/fixture
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/mister-guiiug-dev-wpa-config-*.tgz \
            typescript prettier eslint @eslint/js typescript-eslint globals \
            eslint-plugin-react-hooks eslint-plugin-react-refresh

      - name: tsconfig `extends` resolves through exports
        working-directory: /tmp/fixture
        run: |
          # Un fichier source + `include` sont nécessaires, sinon `tsc` sort en
          # TS18003 ("No inputs were found") — ce qui masquerait le vrai test
          # (la résolution du subpath dans `extends`). --showConfig ne charge
          # pas les paquets de `types`, donc l'absence de vite/node types ici
          # n'est pas un problème : on ne valide QUE la résolution du extends.
          mkdir -p src && echo 'export {};' > src/x.ts
          for cfg in tsconfig-app tsconfig-app-react tsconfig-node; do
            echo "{\"extends\":\"@mister-guiiug/dev-wpa-config/$cfg\",\"include\":[\"src\"]}" > tsconfig.json
            npx tsc --showConfig >/dev/null && echo "✅ extends $cfg"
          done

      - name: Every JS subpath import resolves
        working-directory: /tmp/fixture
        run: |
          node --input-type=module -e "
            const subs = ['eslint-base','eslint-react','prettier','commitlint',
              'lint-staged','vitest-base','vitest-browser-base','playwright-base',
              'tailwind-preset','vite-pwa-base'];
            for (const s of subs) {
              await import('@mister-guiiug/dev-wpa-config/' + s);
              console.log('✅ import ' + s);
            }
          "

      - name: CSS + JSON assets are shipped in the tarball
        working-directory: /tmp/fixture
        run: |
          node -e "require.resolve('@mister-guiiug/dev-wpa-config/tailwind-preset.css'); console.log('✅ tailwind-preset.css present')"
          node -e "require.resolve('@mister-guiiug/dev-wpa-config/tsconfig-app'); console.log('✅ tsconfig-app json present')"
