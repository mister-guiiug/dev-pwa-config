name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: In-repo config parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          # Le lockfile est désormais commité : installs reproductibles, et le
          # cache npm redevient possible. Deux exécutions à une semaine d'écart
          # installaient auparavant des arbres différents.
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # format + lint + typecheck + tests. Le paquet publiait deux configs
      # ESLint sans en appliquer aucune, et livrait `tsconfig-strict-plus` sans
      # jamais type-checker ses propres déclarations.
      - name: Validate
        run: npm run validate

      - name: Les fichiers engendrés sont à jour
        run: |
          npm run sync
          if ! git diff --quiet; then
            echo "::error::Un dérivé a divergé de sa source. Lancer 'npm run sync' et recommiter."
            git --no-pager diff --stat
            exit 1
          fi
          echo "✅ showroom, JSON-LD et tableau du README alignés sur leurs sources"

      - name: Verify TS configs parse
        run: |
          node -e "JSON.parse(require('fs').readFileSync('./tsconfig-app.json'))"
          node -e "JSON.parse(require('fs').readFileSync('./tsconfig-app-react.json'))"
          node -e "JSON.parse(require('fs').readFileSync('./tsconfig-node.json'))"
          node -e "JSON.parse(require('fs').readFileSync('./tsconfig-strict-plus.json'))"
          echo "✅ tsconfigs parsent"

  # ── Smoke test « consommateur réel » ────────────────────────────────────────
  # Le job `validate` ci-dessus ne teste que le dépôt. Il ne prouve PAS que le
  # paquet, une fois `npm pack` + installé, résout ses subpath via la table
  # `exports`. C'est exactement ce trou qui a laissé passer le bug de résolution
  # intermittente du subpath `./tsconfig-app-react` en CI (mister-molkky a dû
  # ré-inliner ses tsconfig/vitest pour le contourner).
  consumer-resolution:
    name: Consumer subpath resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install + pack
        run: |
          npm ci --no-audit --no-fund
          npm pack                       # produit mister-guiiug-dev-wpa-config-*.tgz

      # Les peers sont installés AUX PLAGES QUE LE PAQUET DÉCLARE, pas aux
      # dernières versions absolues. Le job les prenait en `*` : le 03/09/2026,
      # la sortie d'ESLint 10 l'a cassé net (eslint-plugin-jsx-a11y exige encore
      # `eslint@^9`), alors que le socle déclare lui-même `eslint: ^9.39.4`.
      # On testait donc une combinaison que le paquet ne prétend pas supporter,
      # et le résultat dépendait de ce que npmjs avait publié dans la nuit.
      #
      # Le jour où le socle passera à ESLint 10, ce job suivra tout seul.
      # `react-dom` n'est pas un peer déclaré : il est ajouté à la main, parce
      # que `react` sans lui ne se monte pas.
      - name: Scaffold a throwaway consumer
        run: |
          mkdir -p /tmp/fixture
          TARBALL=$(ls "$GITHUB_WORKSPACE"/mister-guiiug-dev-wpa-config-*.tgz | head -1)
          export TARBALL
          node -e "
            const peers = require('$GITHUB_WORKSPACE/package.json').peerDependencies;
            const veut = [
              'typescript', 'prettier', 'eslint', '@eslint/js', 'typescript-eslint',
              'globals', 'eslint-plugin-jsx-a11y', 'eslint-plugin-react-hooks',
              'eslint-plugin-react-refresh', 'react', '@testing-library/jest-dom',
            ];
            const manquants = veut.filter(n => !peers[n]);
            if (manquants.length) {
              throw new Error('plus un peer du paquet : ' + manquants.join(', '));
            }
            const devDependencies = Object.fromEntries(veut.map(n => [n, peers[n]]));
            devDependencies['react-dom'] = peers.react;
            // Le paquet packé est DÉCLARÉ, pas ajouté après coup : greffer un
            // tarball sur un arbre dont les dépendances ne sont pas encore
            // installées faisait échouer npm sur « Cannot read properties of
            // null (reading 'edgesOut') » — un état intermédiaire qu'Arborist
            // ne sait pas relire. Tout déclarer, c'est une seule résolution.
            devDependencies['@mister-guiiug/dev-wpa-config'] =
              'file:' + process.env.TARBALL;
            require('node:fs').writeFileSync(
              '/tmp/fixture/package.json',
              JSON.stringify({ name: 'fixture', version: '1.0.0', private: true, devDependencies }, null, 2)
            );
          "
          cd /tmp/fixture
          # Diagnostic : la version de npm décide, et elle n'apparaît nulle
          # part ailleurs dans le journal.
          node -v && npm -v
          # CACHE ISOLÉ. `setup-node` restaure le cache npm du SOCLE (clé
          # calculée sur son package-lock) ; le réutiliser pour un arbre qui
          # n'a rien à voir faisait échouer npm sur « Cannot read properties
          # of null (reading 'edgesOut') » — et seulement sur le runner, où ce
          # cache existe. Un cache neuf coûte quelques secondes de
          # téléchargement et rend le job reproductible.
          npm install --no-audit --no-fund --cache /tmp/npm-cache-fixture

      - name: tsconfig `extends` resolves through exports
        working-directory: /tmp/fixture
        run: |
          # Un fichier source + `include` sont nécessaires, sinon `tsc` sort en
          # TS18003 ("No inputs were found") — ce qui masquerait le vrai test
          # (la résolution du subpath dans `extends`). --showConfig ne charge
          # pas les paquets de `types`, donc l'absence de vite/node types ici
          # n'est pas un problème : on ne valide QUE la résolution du extends.
          mkdir -p src && echo 'export {};' > src/x.ts
          for cfg in tsconfig-app tsconfig-app-react tsconfig-node tsconfig-strict-plus; do
            echo "{\"extends\":\"@mister-guiiug/dev-wpa-config/$cfg\",\"include\":[\"src\"]}" > tsconfig.json
            npx tsc --showConfig >/dev/null && echo "✅ extends $cfg"
          done

      # La liste n'est plus écrite à la main : elle est DÉRIVÉE de la table
      # `exports` du tarball installé. Elle en couvrait dix sur vingt-six, dont
      # aucun des plus consommés (`react`, `react/observability`, `vite-csp`).
      # Tout nouvel export est désormais couvert d'office.
      #
      # Un seul module ne s'importe pas hors de son contexte, et c'est voulu :
      # il est nommé, avec sa raison. Une liste d'exclusion muette finirait par
      # cacher un vrai module cassé. Les deux modules de mise à jour en sont
      # sortis : `useUpdatePrompt` reçoit désormais `registerSW` en paramètre au
      # lieu d'importer le module virtuel de Vite.
      - name: Every JS subpath import resolves
        working-directory: /tmp/fixture
        run: |
          node --input-type=module -e "
            const { readFileSync } = await import('node:fs');
            // Lu comme un FICHIER : \`package.json\` n'est pas dans la table
            // \`exports\`, donc pas résoluble comme sous-chemin.
            const pkg = JSON.parse(
              readFileSync('node_modules/@mister-guiiug/dev-wpa-config/package.json', 'utf8')
            );
            const CONTEXT_BOUND = {
              'vitest-setup': 'appelle vi.mock() au niveau module — n existe que dans un run Vitest',
            };
            const subs = Object.entries(pkg.exports)
              .filter(([, t]) => (typeof t === 'string' ? t : t.default).endsWith('.js'))
              .map(([s]) => s.replace(/^\.\//, ''));
            let ok = 0;
            for (const s of subs) {
              if (s in CONTEXT_BOUND) {
                console.log('— ' + s + ' : ' + CONTEXT_BOUND[s]);
                continue;
              }
              await import('@mister-guiiug/dev-wpa-config/' + s);
              console.log('✅ import ' + s);
              ok++;
            }
            if (ok < 20) throw new Error('trop peu de sous-chemins couverts : ' + ok);
            console.log(ok + ' sous-chemins JS résolus sur ' + subs.length +
              ' (' + Object.keys(CONTEXT_BOUND).length + ' hors contexte)');
          "

      - name: CSS + JSON assets are shipped in the tarball
        working-directory: /tmp/fixture
        run: |
          node -e "require.resolve('@mister-guiiug/dev-wpa-config/tailwind-preset.css'); console.log('✅ tailwind-preset.css present')"
          node -e "require.resolve('@mister-guiiug/dev-wpa-config/tokens.css'); console.log('✅ tokens.css present')"
          node -e "require.resolve('@mister-guiiug/dev-wpa-config/components.css'); console.log('✅ components.css present')"
          node -e "require.resolve('@mister-guiiug/dev-wpa-config/tsconfig-app'); console.log('✅ tsconfig-app json present')"
