# Workflow CI standard pour les projets miss-* / mister-*.
# Personnaliser :
# - branches déclencheuses (main, develop)
# - secrets/env nécessaires au build (Supabase, Firebase, etc.)
# - jobs E2E spécifiques (a11y, performance)
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  quality:
    name: Format · Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mister-guiiug'

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Activer ce job quand le projet a une suite Playwright. Filtrer avec
  # @critical / @smoke pour des temps PR raisonnables.
  e2e-critical:
    name: E2E (smoke critique)
    runs-on: ubuntu-latest
    needs: quality
    if: false # → mettre à true quand Playwright est en place
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mister-guiiug'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --grep @critical --project=chromium
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-critical-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
